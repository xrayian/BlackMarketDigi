services:
  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: sheriff_server
    restart: unless-stopped
    ports:
      - "2567:2567"
    environment:
      - NODE_ENV=production
      - SERVER_PORT=2567
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:2567', () => process.exit(0)).on('error', () => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - sheriff_net

  client:
    build:
      context: .
      dockerfile: Dockerfile.client
    container_name: sheriff_client
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      server:
        condition: service_healthy
    networks:
      - sheriff_net

networks:
  sheriff_net:
    driver: bridge
